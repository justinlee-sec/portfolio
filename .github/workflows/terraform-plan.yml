name: Terraform plan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: eu-west-1

jobs:
  plan:
    name: Terraform plan
    # Fork PRs get no OIDC token, so skip them instead of failing
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (read-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Initialise
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan

      - name: Summarise plan
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          terraform show -json tfplan > plan.json

          count() { jq "[.resource_changes[]? | select($1)] | length" plan.json; }

          create=$(count '.change.actions == ["create"]')
          update=$(count '.change.actions == ["update"]')
          delete=$(count '.change.actions == ["delete"]')
          replace=$(count '(.change.actions | sort) == ["create","delete"]')

          {
            echo "<!-- terraform-plan -->"
            echo "### Terraform plan"
            echo
            echo "| Create | Update | Replace | Delete |"
            echo "|:--:|:--:|:--:|:--:|"
            echo "| $create | $update | $replace | $delete |"
            echo
            if [ $((create + update + delete + replace)) -eq 0 ]; then
              echo "No changes. Infrastructure matches the configuration."
            else
              jq -r '.resource_changes[]?
                | select(.change.actions != ["no-op"] and .change.actions != ["read"])
                | "- `\(.address)`: \(.change.actions | join(" + "))"' plan.json
            fi
            echo
            echo "Full plan: [workflow run]($RUN_URL)"
          } > comment.md

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('infra/comment.md', 'utf8');
            const marker = '<!-- terraform-plan -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }